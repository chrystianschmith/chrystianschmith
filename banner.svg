<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="1" stop-color="#0d1018"/>
    </linearGradient>
    <radialGradient id="amber" cx=".1" cy=".3" r=".55">
      <stop offset="0" stop-color="#f59e0b" stop-opacity=".22"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neon" cx=".85" cy=".9" r=".55">
      <stop offset="0" stop-color="#3b82f6" stop-opacity=".28"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accentU" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="480" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1e293b"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="r"><rect width="1200" height="340" rx="20"/></clipPath>
    <style>
      .t{font-family:'Inter','Segoe UI',Helvetica,Arial,sans-serif}
      .m{font-family:'JetBrains Mono','Fira Code',Consolas,monospace}

      /* 8s pipeline loop */
      .packet{animation:move 8s cubic-bezier(.6,0,.4,1) infinite}
      @keyframes move{
        0%{transform:translateX(0);opacity:1}
        18%,24%{transform:translateX(140px)}
        42%,48%{transform:translateX(280px)}
        66%,90%{transform:translateX(420px);opacity:1}
        96%,100%{transform:translateX(420px);opacity:0}
      }
      .trail{stroke-dasharray:420;stroke-dashoffset:420;animation:trail 8s cubic-bezier(.6,0,.4,1) infinite}
      @keyframes trail{
        0%{stroke-dashoffset:420;opacity:1}
        18%,24%{stroke-dashoffset:280}
        42%,48%{stroke-dashoffset:140}
        66%,90%{stroke-dashoffset:0;opacity:1}
        96%,100%{stroke-dashoffset:0;opacity:0}
      }
      .n{fill:#0f172a;stroke:#334155;stroke-width:2}
      .n1{animation:n1 8s infinite}.n2{animation:n2 8s infinite}.n3{animation:n3 8s infinite}.n4{animation:n4 8s infinite}
      @keyframes n1{0%,94%{stroke:#22c55e;fill:#052e16}95%,100%{stroke:#334155;fill:#0f172a}}
      @keyframes n2{0%,17%{stroke:#334155;fill:#0f172a}18%,23%{stroke:#f59e0b;fill:#2a1a05}24%,94%{stroke:#22c55e;fill:#052e16}95%,100%{stroke:#334155;fill:#0f172a}}
      @keyframes n3{0%,41%{stroke:#334155;fill:#0f172a}42%,47%{stroke:#f59e0b;fill:#2a1a05}48%,94%{stroke:#22c55e;fill:#052e16}95%,100%{stroke:#334155;fill:#0f172a}}
      @keyframes n4{0%,65%{stroke:#334155;fill:#0f172a}66%,71%{stroke:#f59e0b;fill:#2a1a05}72%,94%{stroke:#22c55e;fill:#052e16}95%,100%{stroke:#334155;fill:#0f172a}}

      .pod{animation:pod 8s infinite;transform-box:fill-box;transform-origin:center}
      .p5{animation-name:pod5}
      @keyframes pod{0%,72%{opacity:0;transform:scale(.4)}76%,92%{opacity:1;transform:scale(1)}97%,100%{opacity:0;transform:scale(.4)}}
      @keyframes pod5{0%,76%{opacity:0;transform:scale(.4)}80%,92%{opacity:1;transform:scale(1)}97%,100%{opacity:0;transform:scale(.4)}}
      .podon{animation:breathe 2.4s ease-in-out infinite}
      @keyframes breathe{0%,100%{opacity:.75}50%{opacity:1}}

      .s1{animation:s1 8s infinite}.s2{animation:s2 8s infinite}
      @keyframes s1{0%,71%{opacity:1}72%,100%{opacity:0}}
      @keyframes s2{0%,71%{opacity:0}72%,94%{opacity:1}95%,100%{opacity:0}}
      .cursor{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
    </style>
  </defs>

  <g clip-path="url(#r)">
    <rect width="1200" height="340" fill="url(#sky)"/>
    <rect width="1200" height="340" fill="url(#grid)" opacity=".7"/>
    <rect width="1200" height="340" fill="url(#amber)"/>
    <rect width="1200" height="340" fill="url(#neon)"/>

    <!-- identity -->
    <text x="64" y="104" class="m" font-size="14" fill="#f59e0b" letter-spacing="3">DEVOPS · CLOUD · AUTOMAÇÃO</text>
    <text x="62" y="162" class="t" font-size="54" font-weight="800" fill="#f8fafc">Chrystian Schmith</text>
    <rect x="64" y="182" width="96" height="4" rx="2" fill="url(#accent)"/>
    <text x="64" y="220" class="t" font-size="19" fill="#cbd5e1">Multi-cloud, pipelines e automação com IA,</text>
    <text x="64" y="246" class="t" font-size="19" fill="#cbd5e1">do commit ao deploy.</text>
    <g transform="translate(64,268)">
      <rect width="250" height="32" rx="16" fill="#0f172a" stroke="#1e293b"/>
      <circle cx="19" cy="16" r="5" fill="#22c55e" class="podon"/>
      <text x="33" y="21" class="m" font-size="12.5" fill="#94a3b8">aws · azure · gcp · alibaba</text>
    </g>

    <!-- pipeline panel -->
    <g transform="translate(620,36)">
      <rect width="540" height="268" rx="14" fill="#0b1120" fill-opacity=".85" stroke="#1e293b"/>
      <circle cx="20" cy="20" r="5" fill="#ef4444"/><circle cx="38" cy="20" r="5" fill="#f59e0b"/><circle cx="56" cy="20" r="5" fill="#22c55e"/>
      <text x="78" y="24" class="m" font-size="12" fill="#64748b">pipeline · main</text>

      <!-- track -->
      <line x1="60" y1="90" x2="480" y2="90" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
      <line x1="60" y1="90" x2="480" y2="90" stroke="url(#accentU)" stroke-width="3" stroke-linecap="round" class="trail"/>

      <!-- stages -->
      <g class="m" font-size="12" fill="#94a3b8" text-anchor="middle">
        <circle cx="60"  cy="90" r="18" class="n n1"/><text x="60"  y="95" fill="#e2e8f0" font-size="13">git</text><text x="60"  y="130">commit</text>
        <circle cx="200" cy="90" r="18" class="n n2"/><text x="200" y="95" fill="#e2e8f0" font-size="13">{ }</text><text x="200" y="130">build</text>
        <circle cx="340" cy="90" r="18" class="n n3"/><text x="340" y="95" fill="#e2e8f0" font-size="13">✓</text><text x="340" y="130">test</text>
        <circle cx="480" cy="90" r="18" class="n n4"/><text x="480" y="95" fill="#e2e8f0" font-size="13">▲</text><text x="480" y="130">deploy</text>
      </g>
      <circle cx="60" cy="90" r="6" fill="#fde68a" filter="url(#glow)" class="packet"/>

      <!-- cluster / pods -->
      <text x="24" y="172" class="m" font-size="11.5" fill="#64748b">cluster · replicas</text>
      <g transform="translate(24,184)">
        <g class="podon"><rect width="70" height="36" rx="8" fill="#0f2a1c" stroke="#22c55e"/><text x="35" y="23" text-anchor="middle" class="m" font-size="11" fill="#86efac">pod-1</text></g>
        <g class="podon" transform="translate(82,0)"><rect width="70" height="36" rx="8" fill="#0f2a1c" stroke="#22c55e"/><text x="35" y="23" text-anchor="middle" class="m" font-size="11" fill="#86efac">pod-2</text></g>
        <g class="podon" transform="translate(164,0)"><rect width="70" height="36" rx="8" fill="#0f2a1c" stroke="#22c55e"/><text x="35" y="23" text-anchor="middle" class="m" font-size="11" fill="#86efac">pod-3</text></g>
        <g transform="translate(246,0)"><g class="pod"><rect width="70" height="36" rx="8" fill="#0c1e3a" stroke="#3b82f6"/><text x="35" y="23" text-anchor="middle" class="m" font-size="11" fill="#93c5fd">pod-4</text></g></g>
        <g transform="translate(328,0)"><g class="pod p5"><rect width="70" height="36" rx="8" fill="#0c1e3a" stroke="#3b82f6"/><text x="35" y="23" text-anchor="middle" class="m" font-size="11" fill="#93c5fd">pod-5</text></g></g>
      </g>

      <!-- status line -->
      <g class="m" font-size="12.5">
        <text x="24" y="250" fill="#f59e0b" class="s1">● running · building → testing → deploying<tspan class="cursor">_</tspan></text>
        <text x="24" y="250" fill="#22c55e" class="s2">✔ deployed · scaled 3 → 5 replicas · 0 downtime</text>
      </g>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="338" rx="20" fill="none" stroke="#1f2937"/>
</svg>
