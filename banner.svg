<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#140b2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e2a44" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow1" cx="0.12" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.9" cy="0.9" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <style>
      .mono{font-family:'JetBrains Mono','Fira Code',Consolas,monospace}
      .sans{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif}
      .cursor{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .line{opacity:0;animation:in .4s ease forwards}
      .l1{animation-delay:.3s}.l2{animation-delay:1.1s}.l3{animation-delay:1.9s}.l4{animation-delay:2.7s}
      @keyframes in{to{opacity:1}}
    </style>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glow1)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glow2)"/>
  <rect x="1" y="1" width="1198" height="298" rx="18" fill="none" stroke="url(#accent)" stroke-opacity=".6" stroke-width="2"/>

  <text x="60" y="110" class="sans" font-size="54" font-weight="800" fill="#e2e8f0">Chrystian Schmith</text>
  <rect x="60" y="128" width="120" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="60" y="175" class="sans" font-size="24" fill="#94a3b8">DevOps &amp; Cloud Infrastructure · Vibe Coder</text>
  <text x="60" y="215" class="mono" font-size="16" fill="#22d3ee">Azure · AWS · Alibaba Cloud · CI/CD · Backup &amp; DR</text>

  <g transform="translate(760,60)">
    <rect width="390" height="190" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <circle cx="22" cy="20" r="6" fill="#ef4444"/><circle cx="42" cy="20" r="6" fill="#f59e0b"/><circle cx="62" cy="20" r="6" fill="#22c55e"/>
    <g class="mono" font-size="15">
      <text x="20" y="66" class="line l1" fill="#e2e8f0"><tspan fill="#a855f7">$</tspan> claude "build, test &amp; ship"</text>
      <text x="20" y="96" class="line l2" fill="#22c55e">✔ 0 failing · lint ok · build ok</text>
      <text x="20" y="126" class="line l3" fill="#e2e8f0"><tspan fill="#a855f7">$</tspan> git push origin main</text>
      <text x="20" y="156" class="line l4" fill="#22d3ee">🚀 pipeline green · deployed</text>
      <rect x="20" y="166" width="10" height="16" fill="#22d3ee" class="cursor"/>
    </g>
  </g>
</svg>
